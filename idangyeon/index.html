<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f9f9f7">
  <title>iDY? 이당연 — 당연하다는 것에 대하여</title>
  <meta name="description" content="당연하다고 여겨온 것들을 다시 묻습니다. 이당연 by GPT · Created by LEE DANG YEON">
  <meta property="og:type" content="website">
  <meta property="og:title" content="iDY? — 이당연">
  <meta property="og:description" content="당연하다는 것에 대하여. 질문할 필요조차 없다고 여겼던 것들.">
  <meta property="og:url" content="https://yame.store/idangyeon/">
  <link rel="canonical" href="https://yame.store/idangyeon/">
  <style>
    :root{color-scheme:light;--bg:#f9f9f7;--text:#191919;--muted:#767676;--line:#dededa;--accent:#c65b36}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.035em;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .frame{width:min(760px,calc(100% - 40px));margin:auto}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:25px 0;color:var(--muted);font-size:12px;letter-spacing:.01em}
    .bar a:hover{color:var(--text)}
    .hero{text-align:center;padding:clamp(50px,10vh,110px) 0 76px}
    .wordmark{display:block;font-family:Arial,Helvetica,sans-serif;font-size:clamp(76px,16vw,132px);font-weight:900;line-height:1;letter-spacing:-.11em;margin:0 0 22px;padding-right:.1em}
    .wordmark b{color:var(--accent)}
    .ko{font-size:18px;font-weight:750;letter-spacing:-.06em}
    .sub{margin:8px 0 0;color:var(--muted);font-size:13px}
    .search{display:flex;align-items:center;border:1px solid #999994;border-radius:999px;min-height:58px;padding:0 18px;gap:12px;width:min(100%,560px);margin:46px auto 0;background:#fff;transition:border-color .2s}
    .search:focus-within{border-color:#111}
    .search svg{width:20px;height:20px;flex:none;stroke:#777;fill:none;stroke-width:1.8}
    .search input{border:0;background:none;outline:0;min-width:0;width:100%;font-size:16px;color:var(--text)}
    .search input::placeholder{color:#999}
    .search button{border:0;background:none;color:var(--muted);padding:5px;font-size:14px;display:none}
    .search.has-text button{display:block}
    .feed{padding:0 0 100px}
    .section-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:17px;border-bottom:1px solid var(--text)}
    .section-head h2{margin:0;font-size:17px;font-weight:700}
    .section-head span{font-size:12px;color:var(--muted)}
    .entry{border-bottom:1px solid var(--line)}
    .entry button{width:100%;text-align:left;background:none;border:0;padding:23px 2px 24px;display:grid;gap:9px}
    .entry button:hover .title{color:var(--accent)}
    .entry .eyebrow{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.06em;color:var(--muted)}
    .entry .title{font-size:clamp(18px,2.8vw,23px);font-weight:650;line-height:1.38;transition:color .15s}
    .entry .summary{font-size:13px;color:var(--muted);line-height:1.6}
    .empty{color:var(--muted);font-size:14px;padding:30px 0}
    .more{display:block;margin:28px auto 0;border:1px solid var(--line);background:none;border-radius:999px;padding:12px 28px;color:var(--text)}
    .more:hover{border-color:#888}
    .article{padding:30px 0 120px}
    .back{border:0;background:none;padding:8px 0;color:var(--muted);font-size:13px}
    .back:hover{color:var(--text)}
    .article .eyebrow{margin:68px 0 16px;font-family:ui-monospace,Consolas,monospace;color:var(--accent);font-size:12px;letter-spacing:.1em}
    .article h1{font-size:clamp(28px,5.5vw,45px);line-height:1.3;letter-spacing:-.06em;margin:0 0 26px}
    .article .lead{font-size:17px;color:#595959;margin:0 0 42px;line-height:1.85}
    .article .body{border-top:1px solid var(--line);padding-top:35px;font-size:16px;line-height:2.08;word-break:keep-all}
    .article .body p{margin:0 0 24px}
    .article .closing{font-weight:700;font-size:19px;line-height:1.8;padding:12px 0}
    .article .share{margin-top:32px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:none}
    footer{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:24px 0 42px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
    [hidden]{display:none!important}
    @media(max-width:520px){.bar{padding:19px 0}.bar .creator{font-size:10px}.hero{padding:64px 0 68px}.search{min-height:54px;margin-top:38px}.entry button{padding:20px 0}footer{flex-direction:column;align-items:flex-start}.article .eyebrow{margin-top:48px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="frame">
    <header class="bar">
      <a href="/" aria-label="야메스토어 홈으로">← YAME.STORE</a>
      <span class="creator">CREATOR · LEE DANG YEON</span>
    </header>

    <main id="home">
      <section class="hero" aria-label="이당연">
        <h1 class="wordmark" aria-label="아이디와이 물음표">iDY<b>?</b></h1>
        <div class="ko">이당연</div>
        <p class="sub">당연하다는 것에 대하여</p>
        <form class="search" id="searchForm" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
          <input id="q" type="search" placeholder="무엇을 검색하시겠습니까?" aria-label="질문 검색" autocomplete="off">
          <button type="button" id="clear" aria-label="검색어 지우기">지우기</button>
        </form>
      </section>
      <section class="feed" aria-labelledby="feedTitle">
        <div class="section-head"><h2 id="feedTitle">최신 질문</h2><span id="count">불러오는 중</span></div>
        <div id="list" aria-live="polite"><p class="empty">질문을 불러오고 있습니다.</p></div>
        <button class="more" id="more" type="button" hidden>더 보기</button>
      </section>
    </main>

    <article class="article" id="article" hidden>
      <button class="back" id="back" type="button">← 질문 목록</button>
      <p class="eyebrow" id="articleNumber"></p>
      <h1 id="articleTitle"></h1>
      <p class="lead" id="articleLead"></p>
      <div class="body" id="articleBody"></div>
      <button class="share" id="share" type="button">링크 복사</button>
    </article>

    <footer>
      <span>iDY? · 이당연 <span aria-hidden="true">—</span> by GPT</span>
      <span>CREATED BY LEE DANG YEON</span>
    </footer>
  </div>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const home = $("home"), article = $("article"), list = $("list"), input = $("q");
      let posts = [], visible = 6;
      const make = (tag, className, value) => {
        const el = document.createElement(tag);
        if(className) el.className = className;
        if(value !== undefined) el.textContent = value;
        return el;
      };
      const urlFor = (id) => new URL("?id=" + encodeURIComponent(id), location.href.split("?")[0]).href;
      function openArticle(id, push = true) {
        const p = posts.find(p => p.id === id);
        if (!p) return;
        $("articleNumber").textContent = "QUESTION " + p.id + " · " + p.date;
        $("articleTitle").textContent = p.title;
        $("articleLead").textContent = p.summary;
        const body = $("articleBody");
        body.replaceChildren();
        for(const paragraph of p.paragraphs) body.append(make("p", "", paragraph));
        body.append(make("p", "closing", p.closing));
        home.hidden = true; article.hidden = false;
        document.title = p.title + " | iDY?";
        if(push) history.pushState({id}, "", urlFor(id));
        window.scrollTo(0,0);
      }
      function showHome(push = true) {
        article.hidden = true; home.hidden = false;
        document.title = "iDY? 이당연 — 당연하다는 것에 대하여";
        if(push) history.pushState({}, "", location.pathname);
        window.scrollTo(0,0);
      }
      function render() {
        const q = input.value.trim().toLocaleLowerCase("ko");
        $("searchForm").classList.toggle("has-text", !!q);
        const matches = posts.filter(p => [p.title,p.summary,...p.paragraphs,p.closing].some(x=>x.toLocaleLowerCase("ko").includes(q)));
        $("count").textContent = matches.length + "개의 질문";
        list.replaceChildren();
        if(!matches.length) list.append(make("p","empty",posts.length ? "검색 결과가 없습니다." : "아직 등록된 질문이 없습니다."));
        for(const p of matches.slice(0,visible)){
          const entry = make("div","entry"), btn = make("button");
          btn.type = "button";
          btn.setAttribute("aria-label",p.title+" 읽기");
          btn.append(make("span","eyebrow","QUESTION "+p.id+" · "+p.date), make("span","title",p.title), make("span","summary",p.summary));
          btn.addEventListener("click",()=>openArticle(p.id));
          entry.append(btn);
          list.append(entry);
        }
        $("more").hidden = matches.length <= visible;
      }
      $("searchForm").addEventListener("submit",e=>{e.preventDefault();render();$("feedTitle").scrollIntoView({behavior:"smooth",block:"start"});});
      input.addEventListener("input",()=>{visible=6;render();});
      $("clear").addEventListener("click",()=>{input.value="";visible=6;render();input.focus();});
      $("more").addEventListener("click",()=>{visible+=6;render();});
      $("back").addEventListener("click",()=>showHome());
      $("share").addEventListener("click",async()=>{const id=new URLSearchParams(location.search).get("id");if(!id)return;try{await navigator.clipboard.writeText(urlFor(id));$("share").textContent="복사했습니다";setTimeout(()=>$("share").textContent="링크 복사",1600)}catch{$("share").textContent="주소창의 링크를 복사해주세요";}});
      addEventListener("popstate",()=>{const id=new URLSearchParams(location.search).get("id");if(id && posts.some(p=>p.id===id))openArticle(id,false);else showHome(false);});
      fetch("./posts.json")
        .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
        .then(data=>{
          if(!Array.isArray(data))throw new Error("Invalid posts format");
          posts=data.filter(p=>p && typeof p.id==="string" && typeof p.title==="string" && Array.isArray(p.paragraphs));
          posts.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
          render();
          const id=new URLSearchParams(location.search).get("id");
          if(id)openArticle(id,false);
        })
        .catch(err=>{console.error(err);list.replaceChildren(make("p","empty","질문을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."));$("count").textContent="연결 확인 필요";});
    })();
  </script>
</body>
</html>
