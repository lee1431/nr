<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한민국 폐기물 매립지도 | YAME.STORE</title>
  <meta name="description" content="대한민국의 폐기물 매립지 위치를 지도 위에서 확인하는 실험형 지도">
  <link rel="canonical" href="https://yame.store/waste-map.html">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root{
      --bg:#f6f8fb;--panel:#fff;--text:#172131;--muted:#728096;--line:#d8e0ea;
      --navy:#1d3f70;--accent:#2f6fe4;--danger:#c94b55;--shadow:0 14px 34px rgba(28,53,88,.08)
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Pretendard,system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg)}
    body{overflow:hidden}
    .app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
    header{
      position:relative;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:16px;
      min-height:70px;padding:12px 18px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
      backdrop-filter:blur(12px)
    }
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;min-width:0}
    .brand-mark{width:38px;height:38px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}
    .title-wrap{min-width:0}
    .title{font-size:17px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
    .sub{margin-top:3px;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap}
    .actions{display:flex;align-items:center;gap:8px}
    .btn{
      border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);
      min-height:40px;padding:0 13px;font-weight:800;cursor:pointer
    }
    .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
    .layout{position:relative;min-height:0}
    #map{position:absolute;inset:0}
    .panel{
      position:absolute;z-index:900;top:16px;left:16px;width:min(360px,calc(100% - 32px));
      background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:18px;
      box-shadow:var(--shadow);backdrop-filter:blur(12px);overflow:hidden
    }
    .panel-head{padding:17px 18px 13px;border-bottom:1px solid #e8edf3}
    .panel-head h1{margin:0;font-size:23px;letter-spacing:-.05em}
    .panel-head p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
    .stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
    .stat span{display:block;font-size:10px;color:var(--muted);font-weight:800}
    .stat strong{display:block;margin-top:5px;color:var(--navy);font-size:18px}
    .controls{padding:0 12px 12px;display:flex;gap:8px;flex-wrap:wrap}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer}
    .chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .status{padding:0 14px 14px;color:var(--muted);font-size:11px;line-height:1.55}
    .status.bad{color:var(--danger)}
    .legend{
      position:absolute;z-index:900;right:16px;bottom:20px;background:rgba(255,255,255,.94);
      border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11px;color:var(--muted);box-shadow:var(--shadow)
    }
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d1495b;margin-right:6px}
    .leaflet-popup-content-wrapper{border-radius:14px}
    .popup-name{font-weight:900;font-size:14px;margin-bottom:6px}
    .popup-row{font-size:11px;color:#5e6b7f;line-height:1.55}
    .popup-link{display:inline-block;margin-top:8px;color:var(--accent);font-size:11px;font-weight:800;text-decoration:none}
    @media(max-width:640px){
      header{min-height:62px;padding:9px 11px}.sub{display:none}.title{font-size:15px}.brand-mark{width:34px;height:34px}
      .actions .btn:not(.primary){display:none}.panel{top:10px;left:10px;width:calc(100% - 20px)}
      .panel-head{padding:13px 14px 10px}.panel-head h1{font-size:20px}.stats{padding:9px}
      .controls{padding:0 9px 9px}.status{padding:0 11px 11px}.legend{right:10px;bottom:14px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="brand" href="./">
        <span class="brand-mark">야</span>
        <span class="title-wrap">
          <div class="title">대한민국 폐기물 매립지도</div>
          <div class="sub">YAME.STORE · EXPERIMENTAL WASTE MAP</div>
        </span>
      </a>
      <div class="actions">
        <button class="btn" type="button" id="fitBtn">전국 보기</button>
        <button class="btn primary" type="button" onclick="location.href='./'">YAME.STORE</button>
      </div>
    </header>

    <main class="layout">
      <div id="map" aria-label="대한민국 폐기물 매립지 지도"></div>

      <section class="panel">
        <div class="panel-head">
          <h1>LANDFILL MAP</h1>
          <p>OpenStreetMap에 공개된 <b>landuse=landfill</b> 데이터를 불러와 대한민국 지도에 표시합니다.</p>
        </div>
        <div class="stats">
          <div class="stat"><span>지도에 표시</span><strong id="count">-</strong></div>
          <div class="stat"><span>이름 확인</span><strong id="namedCount">-</strong></div>
        </div>
        <div class="controls">
          <button class="chip active" type="button" data-filter="all">전체</button>
          <button class="chip" type="button" data-filter="named">이름 있는 곳</button>
        </div>
        <div class="status" id="status">전국 매립지 데이터를 불러오는 중...</div>
      </section>

      <div class="legend"><span class="dot"></span>OSM 등록 매립지 · 공식 전체 목록과는 다를 수 있음</div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false, minZoom: 6 }).setView([36.35, 127.85], 7);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const koreaBounds = L.latLngBounds([33.0, 124.4], [38.8, 131.0]);
    const layer = L.layerGroup().addTo(map);
    const markers = [];
    let currentFilter = 'all';

    const countEl = document.getElementById('count');
    const namedCountEl = document.getElementById('namedCount');
    const statusEl = document.getElementById('status');

    function escapeHtml(value='') {
      return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function markerIcon() {
      return L.divIcon({
        className: '',
        html: '<div style="width:15px;height:15px;border-radius:50%;background:#d1495b;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)"></div>',
        iconSize: [15,15],
        iconAnchor: [7.5,7.5]
      });
    }

    function render() {
      layer.clearLayers();
      const visible = markers.filter(item => currentFilter === 'all' || item.named);
      visible.forEach(item => item.marker.addTo(layer));
      countEl.textContent = visible.length + '곳';
    }

    function makePopup(tags, lat, lon) {
      const name = tags.name || tags['name:ko'] || '이름 미등록 매립지';
      const operator = tags.operator || '';
      const addr = [tags['addr:province'], tags['addr:city'], tags['addr:district'], tags['addr:street']].filter(Boolean).join(' ');
      const osmUrl = 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon + '#map=16/' + lat + '/' + lon;
      return '<div class="popup-name">' + escapeHtml(name) + '</div>' +
        (operator ? '<div class="popup-row">운영: ' + escapeHtml(operator) + '</div>' : '') +
        (addr ? '<div class="popup-row">주소: ' + escapeHtml(addr) + '</div>' : '') +
        '<div class="popup-row">좌표: ' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</div>' +
        '<a class="popup-link" href="' + osmUrl + '" target="_blank" rel="noopener">OpenStreetMap에서 보기 ↗</a>';
    }

    async function loadLandfills() {
      const query = `[out:json][timeout:60];
        area(3600307756)->.kr;
        (
          node["landuse"="landfill"](area.kr);
          way["landuse"="landfill"](area.kr);
          relation["landuse"="landfill"](area.kr);
        );
        out center tags;`;

      const endpoints = [
        'https://overpass-api.de/api/interpreter',
        'https://overpass.kumi.systems/api/interpreter'
      ];

      let data = null;
      let lastError = null;

      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: 'data=' + encodeURIComponent(query)
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          data = await res.json();
          break;
        } catch (err) {
          lastError = err;
        }
      }

      if (!data) throw lastError || new Error('데이터 요청 실패');

      let named = 0;
      for (const el of data.elements || []) {
        const lat = el.lat ?? el.center?.lat;
        const lon = el.lon ?? el.center?.lon;
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
        if (!koreaBounds.contains([lat, lon])) continue;

        const tags = el.tags || {};
        const hasName = Boolean(tags.name || tags['name:ko']);
        if (hasName) named++;

        const marker = L.marker([lat, lon], { icon: markerIcon() })
          .bindPopup(makePopup(tags, lat, lon), { maxWidth: 290 });

        markers.push({ marker, named: hasName });
      }

      namedCountEl.textContent = named + '곳';
      statusEl.textContent = 'OpenStreetMap 공개 데이터를 기준으로 표시했습니다. 누락·중복·위치오차가 있을 수 있어 이후 공공데이터와 교차검증할 예정입니다.';
      render();
    }

    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    document.getElementById('fitBtn').addEventListener('click', () => map.fitBounds(koreaBounds, { padding: [16,16] }));

    loadLandfills().catch(err => {
      console.error(err);
      statusEl.classList.add('bad');
      statusEl.textContent = '매립지 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
      countEl.textContent = '0곳';
      namedCountEl.textContent = '0곳';
    });
  </script>
</body>
</html>
